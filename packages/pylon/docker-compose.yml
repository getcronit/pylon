services:
  postgres:
    # pgvector-enabled Postgres — the db integration tests need the `vector`
    # extension (test/db/integration/vector-nearest.test.ts). Drop-in for
    # `postgres:16`. Default DSN: postgres://pylon:pylon@localhost:5433/pylon_test
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pylon
      POSTGRES_PASSWORD: pylon
      POSTGRES_DB: pylon_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pylon -d pylon_test']
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    # queues integration tests (test/queues/integration/) — default DSN:
    # redis://localhost:6380
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15
