services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pylon
      POSTGRES_PASSWORD: pylon
      POSTGRES_DB: pylon_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pylon -d pylon_test']
      interval: 2s
      timeout: 5s
      retries: 15
