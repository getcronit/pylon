name: Canary Release

# Publishes a snapshot of the changed packages (+ their workspace dependents) on
# every PR, under a PER-PR npm dist-tag `canary-pr-<number>` (e.g.
# `@getcronit/pylon@canary-pr-142`) so PRs never clobber each other's canaries.
# Snapshot VERSIONS are globally unique (see .changeset/config.json
# `prereleaseTemplate: {tag}-{datetime}.{commit}`), so a publish can never
# overwrite an existing version — each PR owns its own moving dist-tag.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '.vscode/**'
    branches:
      - main

jobs:
  release-canary:
    name: Publish snapshot under channel dist-tag
    runs-on: ubuntu-latest
    if:
      ${{ github.actor != 'dependabot[bot]' && github.actor !=
      'dependabot-preview[bot]' && github.actor != 'renovate[bot]' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Resolve PR dist-tag
        id: channel
        run: echo "tag=canary-pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"

      - name: Version snapshot + publish under channel tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.channel.outputs.tag }}"
          echo "Publishing canary channel: $TAG"
          # `--snapshot $TAG` stamps unique versions via the config's
          # prereleaseTemplate; `--tag $TAG` points a per-channel dist-tag at them.
          pnpm changeset version --snapshot "$TAG"
          pnpm changeset publish --tag "$TAG" --no-git-tag

      - name: Summary
        if: always()
        run: |
          echo "### Canary published under \`${{ steps.channel.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Install e.g. \`pnpm add @getcronit/pylon@${{ steps.channel.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
