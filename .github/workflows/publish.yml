name: Publish

# ONE workflow file for every npm publish path, because npm's Trusted Publisher
# (OIDC) binds to a single repo + workflow filename (+ at most ONE environment) per
# package. Splitting publishing across files/environments means only one of them can
# authenticate.
#
#   push to main   → `release` job: from pending changesets it opens/updates the
#                    "Version Packages" PR; once that PR is merged (→ no changesets
#                    left) the same job publishes `latest` via pnpm + OIDC. The
#                    standard changesets/action handles the either/or itself.
#   pull_request    → `canary` job: per-PR snapshot under `canary-pr-<number>`,
#                    OPT-IN via the `canary` label.
#
# Human gate: merging the "Version Packages" PR IS the deliberate release approval —
# review the version bumps + changelog, merge, and `latest` publishes automatically.
# The `release` GitHub Environment carries NO required reviewers (it only exists to
# bind the npm Trusted Publisher's OIDC); don't re-add reviewers or every publish and
# every canary becomes a manual approval click again. Point each package's Trusted
# Publisher at this file (.github/workflows/publish.yml), environment `release`.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '.vscode/**'
    branches:
      - main
  pull_request:
    # `labeled` so adding the `canary` label triggers a snapshot without a new push.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '.vscode/**'
    branches:
      - main

jobs:
  # Release — the canonical changesets/action flow in ONE job. With pending changesets
  # it opens/updates the "Version Packages" PR (no publish). With none (the Version PR
  # was just merged) it publishes `latest`. `changeset publish` only pushes versions
  # not already on the registry, and in this pnpm workspace changesets 3 delegates to
  # `pnpm publish`, so pnpm does the OIDC handshake itself — no npm upgrade, no stored
  # NPM_TOKEN. No reviewer gate: merging the Version PR is the human release approval.
  release:
    name: Release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: release # OIDC Trusted-Publisher binding only — no required reviewers
    permissions:
      contents: write # open the Version Packages PR + push release git tags
      pull-requests: write # manage that release PR
      id-token: write # OIDC trusted publishing to npm (no stored NPM_TOKEN)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup pnpm store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Version or Publish
        # The action decides: pending changesets → open/update the Version PR;
        # none → run the publish command (`pnpm publish` via changesets 3 + OIDC).
        uses: changesets/action@v1
        with:
          version: pnpm ci:version
          publish: pnpm ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gate for the canary job — cheap (checkout + a file check). A canary is a snapshot of
  # PENDING changesets; with none there is nothing to snapshot AND the fallback would
  # burn base versions (see the canary job). Deciding it here lets `needs`/`if` skip the
  # canary job entirely when there is nothing to snapshot.
  changes:
    name: Detect pending changesets
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.check.outputs.has }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' 2>/dev/null)" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

  # Per-PR canary snapshot under `canary-pr-<number>` — OPT-IN via the `canary` label.
  # Publishing a throwaway snapshot on every push is noise, so it runs only when a
  # maintainer adds the `canary` label (and there are pending changesets to snapshot).
  # Uses the SAME `release` environment (npm allows only one) for the OIDC binding.
  canary:
    name: Publish snapshot under channel dist-tag
    needs: changes
    # SECURITY: only same-repo PRs (trusted collaborators). Fork PRs have
    # head.repo.full_name = "<fork-owner>/<repo>" != github.repository → SKIPPED, so
    # untrusted fork code never runs build/publish or reaches the OIDC id-token.
    # The `canary` label makes it opt-in; `needs.changes.outputs.has == 'true'` keeps it
    # from burning base versions when there is nothing to snapshot.
    if:
      ${{ github.event_name == 'pull_request' &&
      needs.changes.outputs.has == 'true' &&
      contains(github.event.pull_request.labels.*.name, 'canary') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
      && github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      pull-requests: write # post the canary-versions report comment
      issues: write # delete the prior report comment so the new one lands at the bottom
      id-token: write # OIDC trusted publishing to npm (no stored NPM_TOKEN)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Resolve PR dist-tag
        id: channel
        run: echo "tag=canary-pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"

      - name: Version snapshot + publish under PR tag
        id: publish
        env:
          # No NPM_TOKEN: changesets 3 delegates publishing to `pnpm publish` in this
          # pnpm workspace, so pnpm performs the OIDC trusted-publishing handshake itself
          # (id-token: write above). Requires a Trusted Publisher configured for this
          # repo+workflow on each package. `changeset version` runs the
          # @changesets/changelog-github plugin (.changeset/config.json), which calls the
          # GitHub API and needs a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.channel.outputs.tag }}"
          # The `changes` job gates this whole job on pending changesets existing, so a
          # canary here always has something to snapshot. (Without changesets,
          # `changeset version --snapshot` bumps nothing and `changeset publish` would
          # fall back to BASE versions — burning a not-yet-released `x.y.z` under the PR
          # dist-tag and blocking its real `latest` release. The job-level gate prevents
          # that by never starting this job in the first place.)
          echo "Publishing canary channel: $TAG"
          # Invoke the changeset BINARY directly via `pnpm exec`. Plain
          # `pnpm changeset ...` runs the repo's `"changeset": "changeset --"`
          # script, so args land as `changeset -- version --snapshot ...` →
          # "Too many arguments" (and it exited 0, so the step went green while
          # publishing nothing). `--snapshot $TAG` stamps unique versions via the
          # config's prereleaseTemplate; `--tag $TAG` sets the per-PR dist-tag.
          pnpm exec changeset version --snapshot "$TAG"
          pnpm exec changeset publish --tag "$TAG" --no-git-tag | tee changeset-publish.log
          # Collect what was actually published (name@version) for the PR comment.
          grep -oE '(@[a-z0-9-]+/[a-z0-9-]+|create-pylon)@[0-9][A-Za-z0-9.-]*' \
            changeset-publish.log | sort -u > published.txt || true
          echo "published-count=$(wc -l < published.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Report canary versions on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = '${{ steps.channel.outputs.tag }}';
            const marker = '<!-- canary-report -->';
            let pkgs = [];
            try {
              pkgs = fs.readFileSync('published.txt', 'utf8').split('\n').filter(Boolean);
            } catch {}
            const sha = (context.payload.pull_request?.head?.sha || context.sha || '').slice(0, 7);
            // Lead with the EXACT immutable versions (these carry the datetime.commit
            // hash and are what this run actually published). The `${tag}` channel is a
            // moving pointer — same string every push — so it goes second as a convenience.
            const exact = pkgs.map(p => `npm install ${p}`);
            const channel = [...new Set(pkgs.map(p => p.replace(/@[0-9].*$/, '') + '@' + tag))]
              .map(i => `npm install ${i}`);
            const body = pkgs.length
              ? `${marker}\n### 🦋 Canary published${sha ? ` from \`${sha}\`` : ''}\n\n` +
                `**Pinned to this build** (immutable — reproducible):\n` +
                '```bash\n' + exact.join('\n') + '\n```\n\n' +
                `<details><summary>Or track the latest on this PR — <code>${tag}</code> (moves every push)</summary>\n\n` +
                '```bash\n' + channel.join('\n') + '\n```\n</details>'
              : `${marker}\n### 🦋 Canary (\`${tag}\`)\n` +
                `No packages were published (no pending changeset touched a publishable package, ` +
                `or the publish step failed — check the job log).`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Delete any prior canary-report comment, then post a fresh one — so the report
            // always lands at the BOTTOM of the PR. An in-place update stays at the original
            // comment's position, which GitHub collapses into the folded history and is easy to
            // miss. Deletes are best-effort (never fail the publish job over a comment).
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            for (const c of comments) {
              if (c.body && c.body.includes(marker)) {
                try {
                  await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
                } catch (e) {
                  core.warning(`Could not delete prior canary comment ${c.id}: ${e.message}`);
                }
              }
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
