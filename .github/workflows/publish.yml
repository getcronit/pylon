name: Publish

# ONE workflow file for BOTH npm publish paths, because npm's Trusted Publisher
# (OIDC) binds to a single repo + workflow filename per package. Splitting release
# and canary across two files means only one of them can ever authenticate via OIDC.
#
#   • push to main      → `release` job  (changesets: open the Version PR, or publish)
#   • pull_request       → `canary` job  (per-PR snapshot under `canary-pr-<n>`)
#
# The two jobs are mutually exclusive (different events), gated by `github.event_name`.
# NOTE: configure the npm Trusted Publisher for each package to reference THIS file
# (.github/workflows/publish.yml).
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '.vscode/**'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '.vscode/**'
    branches:
      - main

jobs:
  release:
    name: Release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets/action opens the Version Packages PR + pushes tags
      pull-requests: write # ...and manages that release PR
      id-token: write # OIDC trusted publishing to npm (no stored NPM_TOKEN)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs npm >= 11.5.1; node 20 ships npm 10.
      - name: Upgrade npm for OIDC publishing
        run: npm i -g npm@latest

      - name: Setup pnpm store
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish: pnpm ci:release
          version: pnpm ci:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: publish authenticates via OIDC trusted publishing
          # (id-token: write + npm >= 11.5.1 + a Trusted Publisher per package).

  canary:
    name: Publish snapshot under channel dist-tag
    # Publishes a snapshot of the changed packages (+ their workspace dependents) on
    # every PR, under a PER-PR npm dist-tag `canary-pr-<number>` (e.g.
    # `@getcronit/pylon@canary-pr-142`) so PRs never clobber each other's canaries.
    # Snapshot VERSIONS are globally unique (see .changeset/config.json
    # `prereleaseTemplate: {tag}-{datetime}.{commit}`), so a publish can never
    # overwrite an existing version — each PR owns its own moving dist-tag.
    if:
      ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
      && github.actor != 'dependabot-preview[bot]' && github.actor != 'renovate[bot]'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the canary-versions report comment
      id-token: write # OIDC trusted publishing to npm (no stored NPM_TOKEN)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs npm >= 11.5.1; node 20 ships npm 10.
      - name: Upgrade npm for OIDC publishing
        run: npm i -g npm@latest

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Resolve PR dist-tag
        id: channel
        run: echo "tag=canary-pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"

      - name: Version snapshot + publish under PR tag
        id: publish
        env:
          # No NPM_TOKEN: `changeset publish` authenticates to npm via OIDC
          # trusted publishing (id-token: write above + npm >= 11.5.1). Requires
          # a Trusted Publisher configured for this repo+workflow on each package.
          # `changeset version` runs the @changesets/changelog-github plugin
          # (.changeset/config.json), which calls the GitHub API and needs a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.channel.outputs.tag }}"
          echo "Publishing canary channel: $TAG"
          # Invoke the changeset BINARY directly via `pnpm exec`. Plain
          # `pnpm changeset ...` runs the repo's `"changeset": "changeset --"`
          # script, so args land as `changeset -- version --snapshot ...` →
          # "Too many arguments" (and it exited 0, so the step went green while
          # publishing nothing). `--snapshot $TAG` stamps unique versions via the
          # config's prereleaseTemplate; `--tag $TAG` sets the per-PR dist-tag.
          pnpm exec changeset version --snapshot "$TAG"
          pnpm exec changeset publish --tag "$TAG" --no-git-tag | tee changeset-publish.log
          # Collect what was actually published (name@version) for the PR comment.
          grep -oE '(@[a-z0-9-]+/[a-z0-9-]+|create-pylon)@[0-9][A-Za-z0-9.-]*' \
            changeset-publish.log | sort -u > published.txt || true
          echo "published-count=$(wc -l < published.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Report canary versions on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = '${{ steps.channel.outputs.tag }}';
            const marker = '<!-- canary-report -->';
            let pkgs = [];
            try {
              pkgs = fs.readFileSync('published.txt', 'utf8').split('\n').filter(Boolean);
            } catch {}
            const sha = (context.payload.pull_request?.head?.sha || context.sha || '').slice(0, 7);
            // Lead with the EXACT immutable versions (these carry the datetime.commit
            // hash and are what this run actually published). The `${tag}` channel is a
            // moving pointer — same string every push — so it goes second as a convenience.
            const exact = pkgs.map(p => `npm install ${p}`);
            const channel = [...new Set(pkgs.map(p => p.replace(/@[0-9].*$/, '') + '@' + tag))]
              .map(i => `npm install ${i}`);
            const body = pkgs.length
              ? `${marker}\n### 🦋 Canary published${sha ? ` from \`${sha}\`` : ''}\n\n` +
                `**Pinned to this build** (immutable — reproducible):\n` +
                '```bash\n' + exact.join('\n') + '\n```\n\n' +
                `<details><summary>Or track the latest on this PR — <code>${tag}</code> (moves every push)</summary>\n\n` +
                '```bash\n' + channel.join('\n') + '\n```\n</details>'
              : `${marker}\n### 🦋 Canary (\`${tag}\`)\n` +
                `No packages were published (no pending changeset touched a publishable package, ` +
                `or the publish step failed — check the job log).`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
