name: Publish

# ONE workflow file for every npm publish path, because npm's Trusted Publisher
# (OIDC) binds to a single repo + workflow filename (+ at most ONE environment) per
# package. Splitting publishing across files/environments means only one of them can
# authenticate.
#
#   push to main   → `version` job  (open/update the Version PR — UNGATED)
#                  → `publish` job  (publish `latest` — GATED by the `release` env,
#                                    runs only when a release is actually pending)
#   pull_request    → `canary` job  (per-PR snapshot; same `release` env)
#
# The `release` GitHub Environment is the human gate: add Required Reviewers in
# Settings → Environments → release. Because npm allows only one environment on the
# Trusted Publisher, `publish` and `canary` BOTH use it (so both are covered by the
# same reviewer gate). Point each package's Trusted Publisher at this file
# (.github/workflows/publish.yml), environment `release`.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '.vscode/**'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - '.vscode/**'
    branches:
      - main

jobs:
  # Version management — UNGATED. Opens/updates the "Version Packages" PR from pending
  # changesets (never publishes). Also reports whether a publishable version is not yet
  # on npm → a real release is pending (i.e. the Version PR was just merged), which is
  # what arms the gated publish job. Reading versions BEFORE changesets/action runs so
  # we see committed `main`, not the action's in-tree bumps.
  version:
    name: Version
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets/action opens the Version Packages PR + pushes tags
      pull-requests: write # ...and manages that release PR
    outputs:
      shouldPublish: ${{ steps.pending.outputs.shouldPublish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      # BEFORE changesets/action mutates the tree: is any publishable package's
      # committed version missing from npm? Only then does `publish` need approval —
      # so the gate never fires for the Version-PR-open run or for no-op pushes.
      - name: Detect pending release
        id: pending
        run: |
          set -euo pipefail
          should=false
          for pj in packages/*/package.json; do
            [ -f "$pj" ] || continue
            priv=$(node -p "require('./$pj').private === true" 2>/dev/null || echo true)
            [ "$priv" = "true" ] && continue
            name=$(node -p "require('./$pj').name")
            ver=$(node -p "require('./$pj').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "· $name@$ver already on npm"
            else
              echo "· $name@$ver NOT on npm → release pending"
              should=true
            fi
          done
          echo "shouldPublish=$should" >> "$GITHUB_OUTPUT"

      - name: Create/Update the Version Packages PR
        uses: changesets/action@v1
        with:
          version: pnpm ci:version
          # No `publish:` here — the gated `publish` job below does that.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish `latest` — GATED by the `release` Environment. Runs only when `version`
  # reported a pending release, so a reviewer is asked to approve ONLY a real publish.
  publish:
    name: Publish (latest)
    needs: version
    if: ${{ github.event_name == 'push' && needs.version.outputs.shouldPublish == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # changesets/action pushes the release git tags
      id-token: write # OIDC trusted publishing to npm (no stored NPM_TOKEN)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs npm >= 11.5.1; the runner ships npm 10, so upgrade to
      # latest. npm@latest (12.x) requires node >= 22 (used here) and rejects unknown config —
      # so pnpm must be >= 10.34.5 (see the root `packageManager`): older pnpm leaked its
      # `--no-git-checks` flag into the `npm publish` subprocess it shells out to, which npm 12
      # fatally rejected (EUNKNOWNCONFIG); hence the pnpm 10.34.5 pin.
      - name: Upgrade npm for OIDC publishing
        run: npm i -g npm@latest

      - name: Setup pnpm store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Publish to npm
        # changesets/action runs the publish command AND pushes the release git tags.
        # With no pending changesets (the state that made shouldPublish true), it just
        # publishes. `changeset publish` only pushes versions not already on the
        # registry. OIDC: id-token: write + npm >= 11.5.1 + a Trusted Publisher
        # (repo + this workflow + environment `release`) per package.
        uses: changesets/action@v1
        with:
          publish: pnpm ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Per-PR canary snapshot under `canary-pr-<number>`. Uses the SAME `release`
  # environment (npm allows only one), so it's covered by the same reviewer gate.
  canary:
    name: Publish snapshot under channel dist-tag
    # SECURITY: only same-repo PRs (trusted collaborators). Fork PRs have
    # head.repo.full_name = "<fork-owner>/<repo>" != github.repository → SKIPPED, so
    # untrusted fork code never runs build/publish or reaches the OIDC id-token.
    if:
      ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
      && github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      pull-requests: write # post the canary-versions report comment
      id-token: write # OIDC trusted publishing to npm (no stored NPM_TOKEN)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs npm >= 11.5.1; the runner ships npm 10, so upgrade to
      # latest. npm@latest (12.x) requires node >= 22 (used here) and rejects unknown config —
      # so pnpm must be >= 10.34.5 (see the root `packageManager`): older pnpm leaked its
      # `--no-git-checks` flag into the `npm publish` subprocess it shells out to, which npm 12
      # fatally rejected (EUNKNOWNCONFIG); hence the pnpm 10.34.5 pin.
      - name: Upgrade npm for OIDC publishing
        run: npm i -g npm@latest

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Resolve PR dist-tag
        id: channel
        run: echo "tag=canary-pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"

      - name: Version snapshot + publish under PR tag
        id: publish
        env:
          # No NPM_TOKEN: `changeset publish` authenticates to npm via OIDC
          # trusted publishing (id-token: write above + npm >= 11.5.1). Requires
          # a Trusted Publisher configured for this repo+workflow on each package.
          # `changeset version` runs the @changesets/changelog-github plugin
          # (.changeset/config.json), which calls the GitHub API and needs a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.channel.outputs.tag }}"
          echo "Publishing canary channel: $TAG"
          # Invoke the changeset BINARY directly via `pnpm exec`. Plain
          # `pnpm changeset ...` runs the repo's `"changeset": "changeset --"`
          # script, so args land as `changeset -- version --snapshot ...` →
          # "Too many arguments" (and it exited 0, so the step went green while
          # publishing nothing). `--snapshot $TAG` stamps unique versions via the
          # config's prereleaseTemplate; `--tag $TAG` sets the per-PR dist-tag.
          pnpm exec changeset version --snapshot "$TAG"
          pnpm exec changeset publish --tag "$TAG" --no-git-tag | tee changeset-publish.log
          # Collect what was actually published (name@version) for the PR comment.
          grep -oE '(@[a-z0-9-]+/[a-z0-9-]+|create-pylon)@[0-9][A-Za-z0-9.-]*' \
            changeset-publish.log | sort -u > published.txt || true
          echo "published-count=$(wc -l < published.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Report canary versions on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = '${{ steps.channel.outputs.tag }}';
            const marker = '<!-- canary-report -->';
            let pkgs = [];
            try {
              pkgs = fs.readFileSync('published.txt', 'utf8').split('\n').filter(Boolean);
            } catch {}
            const sha = (context.payload.pull_request?.head?.sha || context.sha || '').slice(0, 7);
            // Lead with the EXACT immutable versions (these carry the datetime.commit
            // hash and are what this run actually published). The `${tag}` channel is a
            // moving pointer — same string every push — so it goes second as a convenience.
            const exact = pkgs.map(p => `npm install ${p}`);
            const channel = [...new Set(pkgs.map(p => p.replace(/@[0-9].*$/, '') + '@' + tag))]
              .map(i => `npm install ${i}`);
            const body = pkgs.length
              ? `${marker}\n### 🦋 Canary published${sha ? ` from \`${sha}\`` : ''}\n\n` +
                `**Pinned to this build** (immutable — reproducible):\n` +
                '```bash\n' + exact.join('\n') + '\n```\n\n' +
                `<details><summary>Or track the latest on this PR — <code>${tag}</code> (moves every push)</summary>\n\n` +
                '```bash\n' + channel.join('\n') + '\n```\n</details>'
              : `${marker}\n### 🦋 Canary (\`${tag}\`)\n` +
                `No packages were published (no pending changeset touched a publishable package, ` +
                `or the publish step failed — check the job log).`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
