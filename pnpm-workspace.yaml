packages:
  - 'examples/*'
  - 'packages/*'

# pnpm 11 removed `onlyBuiltDependencies` and defaults `strictDepBuilds: true`, so an
# unreviewed dependency build script now FAILS `pnpm install` (pnpm 10 only warned).
# Review the trusted native-toolchain packages here so install stays green. Their
# scripts just link prebuilt platform binaries shipped via optionalDependencies.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
